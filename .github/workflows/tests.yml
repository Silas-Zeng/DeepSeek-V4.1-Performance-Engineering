name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest -r requirements-analysis.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run benchmark smoke test
        run: >-
          python benchmarks/indexer_benchmark.py
          --query-rows 2 --history 256 --head-dim 16 --top-k 8
          --chunk-size 32 --warmup 1 --repeat 2
          --output results/ci-indexer-benchmark.json
